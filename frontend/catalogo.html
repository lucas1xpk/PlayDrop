<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050711">
  <meta name="description" content="Catálogo PlayDrop: pesquise e compare promoções de jogos para PC em reais.">
  <title>Catálogo de Jogos — PlayDrop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="catalog">
  <div class="retro-backdrop compact" aria-hidden="true"><div class="retro-grid"></div><div class="retro-glow one"></div></div>
  <header class="topbar">
    <div class="topbar-inner site-width">
      <a class="brand" href="/" aria-label="PlayDrop - início"><img src="/assets/playdrop-logo.png" alt="PlayDrop"></a>
      <nav class="nav" aria-label="Navegação principal">
        <a href="/">INÍCIO</a><a class="active" href="/catalogo">CATÁLOGO</a><a href="/#desejos">DESEJOS</a><a href="/#historico">HISTÓRICO</a>
      </nav>
      <div class="actions"><a class="top-icon link-icon" href="/#desejos" aria-label="Abrir lista de desejos">♡<span id="wishlistBadge">0</span></a></div>
    </div>
  </header>

  <main class="catalog-main">
    <section class="site-width catalog-intro">
      <div><span class="eyebrow purple">BIBLIOTECA DE OFERTAS</span><h1>ENCONTRE SEU PRÓXIMO JOGO</h1><p>Um jogo por card. Todas as lojas reunidas para comparar.</p></div>
      <form id="catalogSearchForm" class="catalog-search">
        <label class="search-box"><span aria-hidden="true"></span><input id="catalogSearchInput" type="search" autocomplete="off" placeholder="Pesquisar por título..." minlength="2" aria-label="Pesquisar jogo"></label>
        <button type="submit">BUSCAR</button>
        <button id="clearCatalogSearch" class="secondary" type="button">LIMPAR</button>
      </form>
    </section>

    <section class="site-width catalog-workspace">
      <aside class="filter-panel" aria-label="Filtros do catálogo">
        <div class="filter-title"><span>FILTROS</span><button id="resetFilters" type="button">REDEFINIR</button></div>
        <label>LOJA<select id="storeFilter"><option value="all">TODAS AS LOJAS</option></select></label>
        <label>DESCONTO<select id="discountFilter"><option value="0">QUALQUER DESCONTO</option><option value="30">30% OU MAIS</option><option value="50">50% OU MAIS</option><option value="70">70% OU MAIS</option></select></label>
        <label>ATIVAÇÃO<select id="activationFilter"><option value="all">TODAS</option></select></label>
        <fieldset><legend>FAIXA DE PREÇO</legend><div class="price-inputs"><label><span>MÍN.</span><input id="minPrice" type="number" min="0" step="10" placeholder="R$ 0"></label><label><span>MÁX.</span><input id="maxPrice" type="number" min="0" step="10" placeholder="R$ 300"></label></div></fieldset>
        <button id="applyPrice" class="filter-apply" type="button">APLICAR FILTROS</button>
      </aside>

      <div class="catalog-results">
        <div class="results-toolbar">
          <div><span id="catalogCount">CARREGANDO...</span><h2 id="catalogHeading">TODOS OS JOGOS</h2><p id="catalogSubtitle">Ofertas atualizadas e organizadas por relevância</p></div>
          <label class="sort-wrap">ORDENAR POR<select id="sortSelect"><option value="relevance">RELEVÂNCIA</option><option value="popularity">POPULARIDADE</option><option value="discount">MAIOR DESCONTO</option><option value="price">MENOR PREÇO</option></select></label>
        </div>
        <div id="gamesGrid" class="game-grid catalog-grid"></div>
        <button id="loadMore" class="load-more" type="button">CARREGAR MAIS OFERTAS <span>↓</span></button>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="site-width"><img src="/assets/playdrop-logo.png" alt=""><span>PlayDrop © 2026 — Bons jogos, melhores preços</span></div></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/app.js"></script>
</body>
</html>
